<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReconIQ — GST ITC Reconciler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0e1016;
    --sidebar:#12141d;
    --panel:#191c27;
    --panel-2:#20232f;
    --border:#2a2e3d;
    --border-soft:#22252f;
    --text:#e9eaf1;
    --muted:#8b90a5;
    --muted-2:#5f6478;
    --accent:#ff7a3d;
    --accent-dim:#7a3d22;
    --accent-soft:rgba(255,122,61,.12);
    --green:#37d38a;
    --green-soft:rgba(55,211,138,.13);
    --yellow:#f2c14e;
    --yellow-soft:rgba(242,193,78,.13);
    --red:#ff5d6c;
    --red-soft:rgba(255,93,108,.13);
    --blue:#5aa2ff;
    --blue-soft:rgba(90,162,255,.13);
    --purple:#b18aff;
    --purple-soft:rgba(177,138,255,.13);
    --radius:10px;
    --sidebar-w:236px;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="light"]{
    --bg:#f4f5f9;
    --sidebar:#ffffff;
    --panel:#ffffff;
    --panel-2:#f1f2f7;
    --border:#e1e3ec;
    --border-soft:#e9eaf1;
    --text:#181a22;
    --muted:#6b7086;
    --muted-2:#9599ac;
    --accent-soft:rgba(255,122,61,.10);
    --green-soft:rgba(55,211,138,.14);
    --yellow-soft:rgba(242,193,78,.18);
    --red-soft:rgba(255,93,108,.12);
    --blue-soft:rgba(90,162,255,.12);
    --purple-soft:rgba(177,138,255,.14);
  }
  :root[data-theme="blue"]{
    --bg:#eef3fa;
    --sidebar:#1c4d92;
    --panel:#ffffff;
    --panel-2:#eaf1fb;
    --border:#c9d9ee;
    --border-soft:#dbe6f5;
    --text:#152437;
    --muted:#5b7290;
    --muted-2:#8ea1bc;
    --accent:#2f5ea8;
    --accent-dim:#193a68;
    --accent-soft:rgba(47,94,168,.12);
    --green-soft:rgba(55,211,138,.16);
    --yellow-soft:rgba(242,193,78,.22);
    --red-soft:rgba(255,93,108,.14);
    --blue-soft:rgba(90,162,255,.16);
    --purple-soft:rgba(177,138,255,.16);
    --topbar-bg:rgba(216,230,248,.9);
  }
  :root[data-theme="blue"] .brand-mark{background:linear-gradient(145deg,var(--accent),#7fb0e6);}
  :root[data-theme="blue"] .brand-name{color:#ffffff;}
  :root[data-theme="blue"] .brand-sub{color:#c9d9f0;}
  :root[data-theme="blue"] .navlink{color:#d7e5f8;}
  :root[data-theme="blue"] .navlink:hover{background:rgba(255,255,255,.10);color:#ffffff;}
  :root[data-theme="blue"] .navlink.active{background:#f2a900;color:#1a1400;border-color:#f2a900;}
  :root[data-theme="blue"] #sidebar-foot{border-top-color:rgba(255,255,255,.18);}
  :root[data-theme="blue"] .foot-row{color:#c9d9f0;}
  body, .panel, .kpi, .finding-card, #sidebar, #topbar{ transition:background-color .15s ease, border-color .15s ease, color .15s ease; }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  ::selection{background:var(--accent);color:#1a0d05;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  /* ---------- Shell ---------- */
  #shell{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--sidebar);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    padding:22px 14px;
    position:sticky;
    top:0;
    height:100vh;
    padding-top:calc(22px + env(safe-area-inset-top,0px));
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px 8px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(145deg,var(--accent),#ffb199);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:#1a0d05;font-size:16px;
    flex:none;
  }
  .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:16.5px;letter-spacing:.2px;}
  .brand-sub{font-size:10.5px;color:var(--muted-2);margin-top:1px;}

  nav.navlist{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .navlink{
    display:flex;align-items:center;gap:11px;
    padding:9px 12px;border-radius:8px;
    color:var(--muted);text-decoration:none;cursor:pointer;
    font-size:13.5px;font-weight:500;
    border:1px solid transparent;
    background:transparent;
    width:100%;text-align:left;
  }
  .navlink svg{width:16px;height:16px;flex:none;opacity:.85;}
  .navlink:hover{background:var(--panel);color:var(--text);}
  .navlink.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(255,122,61,.25);}
  :root[data-theme="light"] .navlink.active{background:var(--green-soft);color:var(--green);border-color:rgba(55,211,138,.3);}
  .navlink.active svg{opacity:1;}
  .nav-group-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted-2);margin:16px 12px 6px;font-weight:600;
  }
  #sidebar-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--border-soft);}
  .foot-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted-2);padding-top:12px;}

  /* ---------- Main ---------- */
  #main-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
  :root{
    --topbar-bg:rgba(14,16,22,.86);
  }
  :root[data-theme="light"]{
    --topbar-bg:rgba(255,255,255,.86);
  }
  #topbar{
    position:sticky;top:0;z-index:5;
    background:var(--topbar-bg);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:16px 28px;
    padding-top:calc(16px + env(safe-area-inset-top,0px));
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .page-title{font-family:'Space Grotesk';font-weight:600;font-size:19px;}
  .page-sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .topbar-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select.ctrl, input.ctrl{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;
  }
  select.ctrl:focus, input.ctrl:focus, button:focus-visible, .navlink:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px;
  }
  #content{padding:24px 28px 60px;max-width:1320px;width:100%;margin:0 auto;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    padding:9px 15px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn:hover{border-color:#3a3f52;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0d05;}
  .btn.primary:hover{background:#ff8952;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--red);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn svg{width:14px;height:14px;}

  /* ---------- Cards / KPIs ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  @media (max-width:980px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.kpi-grid{grid-template-columns:1fr;}}
  .kpi{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:16px 17px;position:relative;overflow:hidden;
  }
  .kpi .lbl{color:var(--muted);font-size:12px;font-weight:500;margin-bottom:9px;}
  .kpi .val{font-family:'Space Grotesk';font-size:23px;font-weight:600;}
  .kpi .delta{font-size:11.5px;margin-top:7px;display:flex;align-items:center;gap:5px;}
  .kpi .bar{height:3px;border-radius:2px;background:var(--border);margin-top:11px;overflow:hidden;}
  .kpi .bar > span{display:block;height:100%;}

  .panel{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:18px;margin-bottom:18px;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .panel-head h3{margin:0;font-size:15px;font-weight:600;}
  .panel-head .hint{color:var(--muted);font-size:12px;margin-top:2px;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
    font-size:11.5px;font-weight:600;white-space:nowrap;
  }
  .badge.green{background:var(--green-soft);color:var(--green);}
  .badge.yellow{background:var(--yellow-soft);color:var(--yellow);}
  .badge.red{background:var(--red-soft);color:var(--red);}
  .badge.blue{background:var(--blue-soft);color:var(--blue);}
  .badge.purple{background:var(--purple-soft);color:var(--purple);}
  .badge.grey{background:var(--panel-2);color:var(--muted);}
  .badge.orange{background:var(--accent-soft);color:var(--accent);}
  .dot.orange{background:var(--accent);}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .dot.green{background:var(--green);}
  .dot.yellow{background:var(--yellow);}
  .dot.red{background:var(--red);}
  .dot.blue{background:var(--blue);}
  .dot.purple{background:var(--purple);}

  /* ---------- Table ---------- */
  .table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border-soft);}
  table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:640px;}
  thead th{
    text-align:left;background:var(--panel-2);color:var(--muted);
    font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:10px 12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,.02);}
  td.num, th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .empty-row td{padding:36px 12px;text-align:center;color:var(--muted);}

  .findings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:860px){.findings-grid{grid-template-columns:1fr;}}
  .finding-card{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;padding:14px 15px;}
  .finding-card .lbl{color:var(--muted);font-size:11.5px;margin-bottom:6px;}
  .finding-card .val{font-family:'Space Grotesk';font-size:20px;font-weight:600;}
  .finding-card .sub{font-size:11px;color:var(--muted-2);margin-top:4px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-soft);margin-bottom:16px;flex-wrap:wrap;}
  .tab{
    padding:9px 14px;font-size:12.8px;font-weight:600;color:var(--muted);cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--accent);border-color:var(--accent);}
  .tab:hover{color:var(--text);}

  .filter-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .chip{
    padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;
    border:1px solid var(--border);color:var(--muted);background:var(--panel-2);
  }
  .chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  .searchbox{position:relative;flex:1;min-width:180px;max-width:280px;}
  .searchbox input{width:100%;padding-left:32px;}
  .searchbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted-2);}

  /* ---------- Import ---------- */
  .import-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:860px){.import-grid{grid-template-columns:1fr;}}
  .dropzone{
    border:1.5px dashed var(--border);border-radius:10px;padding:28px 16px;text-align:center;
    background:var(--panel-2);cursor:pointer;
  }
  .dropzone:hover{border-color:var(--accent);}
  .dropzone svg{width:26px;height:26px;color:var(--muted);margin-bottom:10px;}
  .dropzone .t1{font-weight:600;font-size:13.5px;}
  .dropzone .t2{color:var(--muted);font-size:11.5px;margin-top:4px;}
  .map-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:14px 0;}
  @media (max-width:640px){.map-grid{grid-template-columns:1fr;}}
  .map-row label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .map-row select{width:100%;}
  .field-req::after{content:' *';color:var(--accent);}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .form-row label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .form-row input,.form-row select{width:100%;}

  .company-list{display:flex;flex-direction:column;gap:8px;}
  .company-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:11px 13px;
  }
  .company-item.active{border-color:var(--accent);}
  .company-item .nm{font-weight:600;font-size:13px;}
  .company-item .gst{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono';margin-top:2px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:11px 18px;border-radius:9px;font-size:13px;font-weight:500;
    box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;gap:9px;
    bottom:calc(22px + env(safe-area-inset-bottom,0px));
  }
  .toast.show{display:flex;}
  .toast{display:none;}
  .toast svg{width:15px;height:15px;color:var(--green);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state svg{width:34px;height:34px;color:var(--muted-2);margin-bottom:12px;}
  .empty-state .t1{font-weight:600;color:var(--text);font-size:14.5px;margin-bottom:5px;}

  .section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:24px 0 12px;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border-soft);gap:20px;}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .t1{font-weight:600;font-size:13.5px;}
  .settings-row .t2{color:var(--muted);font-size:12px;margin-top:3px;}
  .switch{position:relative;width:38px;height:22px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider-tog{position:absolute;inset:0;background:var(--border);border-radius:20px;cursor:pointer;transition:.15s;}
  .slider-tog:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  input:checked + .slider-tog{background:var(--accent);}
  input:checked + .slider-tog:before{transform:translateX(16px);}

  .hidden{display:none !important;}
  .flex{display:flex;}
  .gap8{gap:8px;}
  .mt0{margin-top:0;}
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">R</div>
      <div>
        <div class="brand-name">ReconIQ</div>
        <div class="brand-sub">GST ITC reconciler</div>
      </div>
    </div>

    <nav class="navlist" id="navlist"></nav>

    <div id="sidebar-foot">
      <div class="foot-row"><span>Data stored</span><span>on this device</span></div>
    </div>
  </aside>

  <div id="main-col">
    <header id="topbar">
      <div>
        <div class="page-title" id="pageTitle">Dashboard</div>
        <div class="page-sub" id="pageSub">Audit intelligence overview</div>
      </div>
      <div class="topbar-controls">
        <button class="btn ghost" id="themeToggle" title="Toggle dark / light mode"></button>
        <select class="ctrl" id="companySelect"></select>
        <select class="ctrl" id="fySelect"></select>
        <select class="ctrl" id="monthSelect"></select>
      </div>
    </header>
    <main id="content"></main>
  </div>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span id="toastMsg"></span></div>

<script>
/* ============================= ICONS ============================= */
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>',
  recon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>',

}
function applyTheme(){

/* ============================= HELPERS ============================= */
function fmtINR(n){
  n = Number(n)||0;
  const neg = n < 0; n = Math.abs(n);
  let s = n.toFixed(0);
  let last3 = s.length > 3 ? s.slice(-3) : s;
  let rest = s.length > 3 ? s.slice(0, -3) : '';
  if(rest !== '') last3 = ',' + last3;
  rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  return (neg?'-':'') + '₹' + rest + last3;
}
function fmtNum(n){ return Number(n||0).toLocaleString('en-IN'); }
function normGSTIN(v){ return String(v||'').trim().toUpperCase().replace(/\s+/g,''); }
function normInv(v){
  let s = String(v||'').trim().toUpperCase();
  if(state.settings.normalizeInvoice) s = s.replace(/[^A-Z0-9]/g,'');
  return s;
}
function taxTotal(r){ return (Number(r.igst)||0) + (Number(r.cgst)||0) + (Number(r.sgst)||0) + (Number(r.cess)||0); }
function rowKey(r){ return normGSTIN(r.gstin) + '|' + normInv(r.invoiceNo); }
function monthIndex(m){ return MONTHS.indexOf(m); }
function isGovtGSTIN(gstin){
  // Government / PSU department GSTINs conventionally carry a 'GOV' style PAN slot or are tagged explicitly.
  // Falls back to the explicit supplierType flag set during import/mapping.
  return false;
}

function currentBooks(){

/* ============================= RECONCILIATION ENGINE ============================= */
function runReconciliation(){
  const books = currentBooks();
  const g2b = currentGstr2b();
  const tol = Number(state.settings.tolerance)||0;

  const bookKeyCount = {};
  books.forEach(r => { const k = rowKey(r); bookKeyCount[k] = (bookKeyCount[k]||0)+1; });
  const g2bKeyCount = {};
  g2b.forEach(r => { const k = rowKey(r); g2bKeyCount[k] = (g2bKeyCount[k]||0)+1; });

  const g2bByKey = {};
  g2b.forEach(r => { const k = rowKey(r); (g2bByKey[k] = g2bByKey[k] || []).push(r); });

  const usedG2b = new Set();
  const results = [];

  books.forEach(bRow => {
    const k = rowKey(bRow);
    const pool = g2bByKey[k] || [];
    const candidate = pool.find(m => !usedG2b.has(m.id));
    const isDup = bookKeyCount[k] > 1 || g2bKeyCount[k] > 1;

    if(candidate){
      usedG2b.add(candidate.id);
      const diffTaxable = Math.round((Number(bRow.taxable||0) - Number(candidate.taxable||0)) * 100) / 100;
      const diffTax = Math.round((taxTotal(bRow) - taxTotal(candidate)) * 100) / 100;
      let status = (Math.abs(diffTaxable) <= tol && Math.abs(diffTax) <= tol) ? 'Matched' : 'Amount Mismatch';
      if(isDup) status = 'Duplicate';
      results.push({
        id: 'r_'+bRow.id, status, gstin: bRow.gstin, supplierName: bRow.supplierName || candidate.supplierName,
        invoiceNo: bRow.invoiceNo, invoiceDate: bRow.invoiceDate,
        booksTaxable: bRow.taxable, booksTax: taxTotal(bRow),
        g2bTaxable: candidate.taxable, g2bTax: taxTotal(candidate),
        diffTaxable, diffTax, supplierType: candidate.supplierType || bRow.supplierType || '',
        gstr1Filed: candidate.gstr1Filed || '',
      });
    } else {
      results.push({
        id: 'r_'+bRow.id, status: isDup ? 'Duplicate' : 'Missing in 2B', gstin: bRow.gstin, supplierName: bRow.supplierName,
        invoiceNo: bRow.invoiceNo, invoiceDate: bRow.invoiceDate,
        booksTaxable: bRow.taxable, booksTax: taxTotal(bRow),
        g2bTaxable: null, g2bTax: null, diffTaxable: bRow.taxable, diffTax: taxTotal(bRow),
        supplierType: bRow.supplierType || '', gstr1Filed: '',
      });
    }
  });

  g2b.forEach(r => {
    if(!usedG2b.has(r.id)){
      results.push({
        id: 'r2_'+r.id, status: 'Missing in Books', gstin: r.gstin, supplierName: r.supplierName,
        invoiceNo: r.invoiceNo, invoiceDate: r.invoiceDate,
        booksTaxable: null, booksTax: null, g2bTaxable: r.taxable, g2bTax: taxTotal(r),
        diffTaxable: -(Number(r.taxable)||0), diffTax: -taxTotal(r),
        supplierType: r.supplierType || '', gstr1Filed: r.gstr1Filed || '',
      });
    }
  });

  return results;
}

function reconSummary(rows){
  const s = { Matched:0, 'Amount Mismatch':0, 'Missing in 2B':0, 'Missing in Books':0, Duplicate:0 };
  const val = { Matched:0, 'Amount Mismatch':0, 'Missing in 2B':0, 'Missing in Books':0, Duplicate:0 };
  rows.forEach(r => { s[r.status] = (s[r.status]||0)+1; val[r.status] = (val[r.status]||0) + Math.abs(r.booksTax ?? r.g2bTax ?? 0); });
  return { counts: s, values: val, total: rows.length };
}

// Books rows whose invoice date falls in an earlier tax period than the FY/month currently selected —
// i.e. ITC being carried forward / claimed late against an older invoice.
function computeOldITC(){
  const books = currentBooks();
  const selMonthIdx = monthIndex(state.month);
  return books.filter(r => {
    const d = parseInvoiceDate(r.invoiceDate);
    if(!d) return false;
    const invMonthIdx = d.getMonth() >= 3 ? d.getMonth()-3 : d.getMonth()+9;
    const invFY = (d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1);
    const [fyStart] = state.fy.split('-').map(Number);
    if(invFY < fyStart) return true;
    if(invFY === fyStart && invMonthIdx < selMonthIdx) return true;
    return false;
  });
}
function parseInvoiceDate(s){
  if(!s) return null;
  const str = String(s).trim();
  let m = str.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/);
  if(m){ let [,d,mo,y] = m; if(y.length===2) y = '20'+y; return new Date(Number(y), Number(mo)-1, Number(d)); }
  const d2 = new Date(str);
  return isNaN(d2) ? null : d2;
}

// GSTR-2B lines with no corresponding books entry at all — ITC available but not yet booked/claimed.
function computeNotClaimed(){
  return runReconciliation().filter(r => r.status === 'Missing in Books');
}

// GSTR-2B rows shown across every month of the selected FY (cumulative view for the company).
function computeG2bAllMonths(){

}

// GSTR-2B rows tagged as Government / PSU suppliers via the supplierType field set at import.
function computeG2bGovt(){
  return currentGstr2b().filter(r => String(r.supplierType||'').toLowerCase().startsWith('gov'));
}

}

function kpi(label, val, sub, color){

}
function findingCard(label, count, value, color){
  return `<div class="finding-card">
    <div class="lbl"><span class="dot ${color}" style="display:inline-block;margin-right:6px;"></span>${label}</div>
    <div class="val">${fmtNum(count)}</div>

  </div>`;
}

function emptyState(iconKey, title, sub){

}
function wireEmptyActions(el){

/* ============================= BOOKS / GSTR-2B / RCM TABLES ============================= */
function renderDataTable(kind, el){
  const isBooks = kind === 'books';
  const isRcm = kind === 'rcm';
  const rows = isBooks ? currentBooks() : isRcm ? currentRcm() : currentGstr2b();
  const total = rows.reduce((a,r)=>a+Number(r.taxable||0),0);
  const tax = rows.reduce((a,r)=>a+taxTotal(r),0);
  const label = isBooks ? 'Books' : isRcm ? 'RCM' : 'GSTR-2B';

  el.innerHTML = `
    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
      ${kpi('Invoices', fmtNum(rows.length), isBooks?'Rows in purchase register':isRcm?'Reverse charge invoices':'Lines from GSTR-2B', 'var(--accent)')}
      ${kpi('Taxable Value', fmtINR(total), 'Sum for this period', 'var(--blue)')}
      ${kpi(isRcm?'Total Tax Payable/ITC':'Total Tax (ITC)', fmtINR(tax), 'IGST + CGST + SGST + Cess', 'var(--green)')}
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h3>${isBooks?'Books purchase register':isRcm?'RCM invoice register':'GSTR-2B statement'}</h3><div class="hint">${activeCompany()?.name||''} · ${state.month} FY${state.fy}</div></div>
        <div class="flex gap8">
          <button class="btn ghost" data-goto-import="${kind}">${ICONS.upload} Import</button>
          ${rows.length? `<button class="btn danger" id="clearPeriod">${ICONS.trash} Clear this period</button>`:''}
        </div>
      </div>
      ${rows.length ? renderPlainTable(rows, isBooks) : `<div class="table-wrap"><table><tbody><tr class="empty-row"><td>No rows yet for this company / period. Use Import to bring in ${label} data.</td></tr></tbody></table></div>`}
    </div>
  `;
  el.querySelectorAll('[data-goto-import]').forEach(b=> b.onclick = () => { state.page='import'; state._importTarget = b.dataset.gotoImport; save(); renderAll(); });
  const cp = el.querySelector('#clearPeriod');
  if(cp) cp.onclick = () => {
    if(!confirm('Remove all ' + label + ' rows for this company & period?')) return;
    const key = isBooks ? 'books' : isRcm ? 'rcm' : 'gstr2b';
    state[key] = state[key].filter(r => !(r.companyId===state.activeCompanyId && r.fy===state.fy && r.month===state.month));
    save(); renderAll(); toast('Period data cleared');
  };
}

// Data-quality based priority: flags incomplete GSTIN, zero taxable value, or an
// unparseable invoice date as "Review" (orange); everything else is "OK" (green).
function rowDataIssues(r){
  const issues = [];
  if(!r.gstin || normGSTIN(r.gstin).length !== 15) issues.push('GSTIN looks incomplete');
  if(!Number(r.taxable)) issues.push('Taxable value is zero');
  if(!parseInvoiceDate(r.invoiceDate)) issues.push('Invoice date could not be read');
  return issues;
}
function priorityBadge(needsAttention, title){
  const cls = needsAttention ? 'orange' : 'green';
  const label = needsAttention ? 'Review' : 'OK';
  return `<span class="badge ${cls}" title="${esc(title||'')}"><span class="dot ${cls}"></span>${label}</span>`;
}
function renderPlainTable(rows, isBooks, opts){
  opts = opts || {};
  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>Priority</th><th>Invoice No.</th><th>Date</th><th>${isBooks?'Supplier':'Supplier'} GSTIN</th><th>Supplier Name</th>
      <th class="num">Taxable</th><th class="num">IGST</th><th class="num">CGST</th><th class="num">SGST</th><th class="num">Cess</th><th class="num">Total</th>
    </tr></thead>
    <tbody>
      ${rows.map(r => {
        const issues = rowDataIssues(r);
        const attention = !!opts.forceAttention || issues.length > 0;
        const title = opts.forceAttention ? (opts.attentionReason || 'Needs attention') : (issues.join('; ') || 'Looks complete');
        return `<tr>
        <td>${priorityBadge(attention, title)}</td>
        <td>${esc(r.invoiceNo)}</td><td>${esc(r.invoiceDate)}</td><td class="mono">${esc(r.gstin)}</td><td>${esc(r.supplierName)}</td>
        <td class="num">${fmtNum(r.taxable)}</td><td class="num">${fmtNum(r.igst)}</td><td class="num">${fmtNum(r.cgst)}</td><td class="num">${fmtNum(r.sgst)}</td><td class="num">${fmtNum(r.cess)}</td>
        <td class="num">${fmtNum(Number(r.taxable||0)+taxTotal(r))}</td>
      </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= RECONCILIATION PAGE ============================= */
function renderReconciliation(el){
  if(currentBooks().length===0 && currentGstr2b().length===0 && currentRcm().length===0){
    el.innerHTML = emptyState('recon', 'Nothing to reconcile yet', 'Import books, GSTR-2B or RCM data for this period, then come back here — matching runs automatically.');
    wireEmptyActions(el);
    return;
  }

  const view = state.reconView || 'match';
  el.innerHTML = `
    <div class="tabs" id="reconViewTabs">
      ${RECON_VIEWS.map(v => `<div class="tab ${view===v.id?'active':''}" data-view="${v.id}">${v.label}</div>`).join('')}
    </div>
    <div id="reconViewBody"></div>
  `;
  el.querySelectorAll('[data-view]').forEach(t => t.onclick = () => { state.reconView = t.dataset.view; save(); renderAll(); });
  const body = document.getElementById('reconViewBody');
  const renderers = {
    match: renderReconMatchView,
    oldItc: renderOldItcView,
    notClaimed: renderNotClaimedView,
    g2bAll: renderG2bAllView,

    rcm: renderRcmView,
    booksItc: renderBooksItcView,
    gstr1: renderGstr1View,
  };
  (renderers[view] || renderReconMatchView)(body);
}

function renderReconMatchView(el){
  const rows = runReconciliation();
  const sum = reconSummary(rows);
  const filter = state.reconFilter || 'all';
  const filtered = filter==='all' ? rows : rows.filter(r=>r.status===filter);

  el.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Match result</h3><div class="hint">${activeCompany()?.name||''} · ${state.month} FY${state.fy} · ${fmtNum(rows.length)} total lines</div></div>
        <div class="flex gap8">
          <div class="searchbox">${ICONS.search}<input class="ctrl" id="reconSearch" placeholder="Search invoice / GSTIN / supplier"></div>
          <button class="btn ghost" id="exportReconBtn">${ICONS.download} Export</button>
        </div>
      </div>
      <div class="filter-row">
        ${chip('all','All',sum.total)}
        ${chip('Matched','Matched',sum.counts['Matched']||0)}
        ${chip('Amount Mismatch','Mismatch',sum.counts['Amount Mismatch']||0)}
        ${chip('Missing in 2B','Missing in 2B',sum.counts['Missing in 2B']||0)}
        ${chip('Missing in Books','Missing in Books',sum.counts['Missing in Books']||0)}
        ${chip('Duplicate','Duplicate',sum.counts['Duplicate']||0)}
      </div>
      <div id="reconTableWrap">${renderReconTable(filtered, true)}</div>
    </div>
  `;
  el.querySelectorAll('[data-chip]').forEach(c => c.onclick = () => { state.reconFilter = c.dataset.chip; save(); renderAll(); });
  const search = el.querySelector('#reconSearch');
  search.oninput = () => {
    const q = search.value.trim().toLowerCase();
    const base = filter==='all' ? rows : rows.filter(r=>r.status===filter);

    document.getElementById('reconTableWrap').innerHTML = renderReconTable(f2, true);
  };
  el.querySelector('#exportReconBtn').onclick = () => exportWorkbook('reconciliation');
}

function chip(val,label,count){

// Reconciliation-row priority: Matched lines are low risk (green); anything else
// (mismatch, missing, duplicate) needs attention before filing (orange).
function reconRowAttention(r){ return r.status !== 'Matched'; }
function renderReconTable(rows, full){
  if(!rows.length) return `<div class="table-wrap"><table><tbody><tr class="empty-row"><td>No lines in this view.</td></tr></tbody></table></div>`;
  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>Priority</th><th>Status</th><th>Invoice No.</th><th>Date</th><th>GSTIN</th><th>Supplier</th>
      <th class="num">Books Taxable</th><th class="num">2B Taxable</th><th class="num">Books Tax</th><th class="num">2B Tax</th><th class="num">Diff (Tax)</th>
    </tr></thead>
    <tbody>
      ${rows.map(r => {
        const meta = STATUS_META[r.status] || {cls:'grey',dot:'grey'};
        const attention = reconRowAttention(r);
        return `<tr>
          <td>${priorityBadge(attention, attention ? 'Needs review before filing: '+r.status : 'Matched — no action needed')}</td>
          <td><span class="badge ${meta.cls}"><span class="dot ${meta.dot}"></span>${r.status}</span></td>
          <td>${esc(r.invoiceNo)}</td><td>${esc(r.invoiceDate)}</td><td class="mono">${esc(r.gstin)}</td><td>${esc(r.supplierName)}</td>
          <td class="num">${r.booksTaxable!=null?fmtNum(r.booksTaxable):'—'}</td>
          <td class="num">${r.g2bTaxable!=null?fmtNum(r.g2bTaxable):'—'}</td>
          <td class="num">${r.booksTax!=null?fmtNum(r.booksTax):'—'}</td>
          <td class="num">${r.g2bTax!=null?fmtNum(r.g2bTax):'—'}</td>
          <td class="num" style="color:${Math.abs(r.diffTax||0)>0 ? 'var(--yellow)':'var(--muted)'}">${fmtNum(r.diffTax)}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}

/* ============================= REPORTS ============================= */
const REPORT_TABS = ['Match Summary','Supplier-wise','Month-wise','Mismatch Report','Missing Invoice Report','ITC Difference'];
function renderReports(el){
  const rows = runReconciliation();
  if(!state._reportTab) state._reportTab = REPORT_TABS[0];
  if(currentBooks().length===0 && currentGstr2b().length===0){
    el.innerHTML = emptyState('reports','No data to report on', 'Import or load sample data for this period to generate reports.');
    wireEmptyActions(el);
    return;
  }
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Reports</h3><div class="hint">${activeCompany()?.name||''} · ${state.month} FY${state.fy}</div></div>
        <button class="btn primary" id="exportAllBtn">${ICONS.download} Export all to Excel</button>
      </div>
      <div class="tabs">${REPORT_TABS.map(t=>`<div class="tab ${state._reportTab===t?'active':''}" data-tab="${t}">${t}</div>`).join('')}</div>
      <div id="reportBody"></div>
    </div>
  `;
  el.querySelectorAll('[data-tab]').forEach(t => t.onclick = () => { state._reportTab = t.dataset.tab; renderAll(); });
  el.querySelector('#exportAllBtn').onclick = () => exportWorkbook('all');
  document.getElementById('reportBody').innerHTML = buildReportBody(state._reportTab, rows);

function buildReportBody(tab, rows){
  const sum = reconSummary(rows);
  if(tab==='Match Summary'){
    return `<div class="table-wrap"><table>
      <thead><tr><th>Status</th><th class="num">Invoices</th><th class="num">Tax Value</th><th class="num">% of Total</th></tr></thead>
      <tbody>${Object.keys(sum.counts).map(k=>{
        const meta = STATUS_META[k];
        const pct = sum.total? (sum.counts[k]/sum.total*100).toFixed(1):'0.0';
        return `<tr><td><span class="badge ${meta.cls}"><span class="dot ${meta.dot}"></span>${k}</span></td><td class="num">${fmtNum(sum.counts[k])}</td><td class="num">${fmtINR(sum.values[k])}</td><td class="num">${pct}%</td></tr>`;
      }).join('')}</tbody></table></div>`;
  }
  if(tab==='Supplier-wise'){
    const bySupplier = {};
    rows.forEach(r => {
      const key = r.gstin || 'Unknown';
      bySupplier[key] = bySupplier[key] || {name:r.supplierName, gstin:key, matched:0, mismatch:0, missing2b:0, missingBooks:0, dup:0, taxDiff:0};
      const b = bySupplier[key];
      if(r.status==='Matched') b.matched++;
      if(r.status==='Amount Mismatch') b.mismatch++;
      if(r.status==='Missing in 2B') b.missing2b++;
      if(r.status==='Missing in Books') b.missingBooks++;
      if(r.status==='Duplicate') b.dup++;
      b.taxDiff += Math.abs(r.diffTax||0);
    });
    const list = Object.values(bySupplier).sort((a,b)=>b.taxDiff-a.taxDiff);
    return `<div class="table-wrap"><table>
      <thead><tr><th>Supplier</th><th>GSTIN</th><th class="num">Matched</th><th class="num">Mismatch</th><th class="num">Missing 2B</th><th class="num">Missing Books</th><th class="num">Dup</th><th class="num">Tax Diff</th></tr></thead>
      <tbody>${list.map(b=>`<tr><td>${esc(b.name)}</td><td class="mono">${esc(b.gstin)}</td><td class="num">${b.matched}</td><td class="num">${b.mismatch}</td><td class="num">${b.missing2b}</td><td class="num">${b.missingBooks}</td><td class="num">${b.dup}</td><td class="num">${fmtNum(b.taxDiff)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  if(tab==='Month-wise'){
    const co = state.activeCompanyId, fy = state.fy;
    const byMonth = MONTHS.map(m => {
      const b = state.books.filter(r=>r.companyId===co && r.fy===fy && r.month===m);
      const g = state.gstr2b.filter(r=>r.companyId===co && r.fy===fy && r.month===m);
      return { month:m, books:b.length, g2b:g.length, itcBooks: b.reduce((a,r)=>a+taxTotal(r),0), itc2b: g.reduce((a,r)=>a+taxTotal(r),0) };
    });
    return `<div class="table-wrap"><table>
      <thead><tr><th>Month</th><th class="num">Books Invoices</th><th class="num">2B Invoices</th><th class="num">ITC Books</th><th class="num">ITC 2B</th><th class="num">Gap</th></tr></thead>
      <tbody>${byMonth.map(m=>`<tr ${m.month===state.month?'style="background:rgba(255,122,61,.06)"':''}><td>${m.month}</td><td class="num">${m.books}</td><td class="num">${m.g2b}</td><td class="num">${fmtNum(m.itcBooks)}</td><td class="num">${fmtNum(m.itc2b)}</td><td class="num">${fmtNum(m.itcBooks-m.itc2b)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  if(tab==='Mismatch Report'){
    const mism = rows.filter(r=>r.status==='Amount Mismatch');
    if(!mism.length) return `<div class="table-wrap"><table><tbody><tr class="empty-row"><td>No amount mismatches for this period.</td></tr></tbody></table></div>`;
    return renderReconTable(mism, false);
  }
  if(tab==='Missing Invoice Report'){
    const missing = rows.filter(r=>r.status==='Missing in 2B' || r.status==='Missing in Books');
    if(!missing.length) return `<div class="table-wrap"><table><tbody><tr class="empty-row"><td>No missing invoices for this period.</td></tr></tbody></table></div>`;
    return renderReconTable(missing, false);
  }
  if(tab==='ITC Difference'){
    const books = currentBooks(), g2b = currentGstr2b();
    const itcBooks = books.reduce((a,r)=>a+taxTotal(r),0);
    const itc2b = g2b.reduce((a,r)=>a+taxTotal(r),0);
    const diff = itcBooks - itc2b;
    return `<div class="findings-grid">
      ${findingCard('ITC as per Books', 0, itcBooks, 'blue').replace('0<','&nbsp;<')}
      ${findingCard('ITC as per GSTR-2B', 0, itc2b, 'purple').replace('0<','&nbsp;<')}
      ${findingCard('Net Difference', 0, diff, diff>=0?'yellow':'red').replace('0<','&nbsp;<')}
    </div>
    <p style="color:var(--muted);font-size:12.5px;margin-top:14px;">A positive difference means your books claim more ITC than GSTR-2B supports — those invoices need supplier follow-up before filing. A negative difference means GSTR-2B has ITC not yet booked.</p>`;
  }
  return '';
}

/* ============================= EXPORT (XLSX) ============================= */
async function exportWorkbook(mode){
  const rows = runReconciliation();
  const wb = XLSX.utils.book_new();

  const reconSheet = rows.map(r => ({
    Status:r.status, 'Invoice No':r.invoiceNo, Date:r.invoiceDate, GSTIN:r.gstin, Supplier:r.supplierName,
    'Books Taxable':r.booksTaxable, '2B Taxable':r.g2bTaxable, 'Books Tax':r.booksTax, '2B Tax':r.g2bTax, 'Diff (Tax)':r.diffTax,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(reconSheet), 'Reconciliation');

  if(mode === 'all'){
    const sum = reconSummary(rows);
    const summarySheet = Object.keys(sum.counts).map(k => ({ Status:k, Invoices:sum.counts[k], 'Tax Value':sum.values[k] }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summarySheet), 'Match Summary');

    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(currentBooks().map(r=>({
      'Invoice No':r.invoiceNo,'Invoice Date':r.invoiceDate,'Supplier GSTIN':r.gstin,'Supplier Name':r.supplierName,
      'Taxable Value':r.taxable, IGST:r.igst, CGST:r.cgst, SGST:r.sgst, Cess:r.cess,
    }))), 'Books');

    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(currentGstr2b().map(r=>({
      GSTIN:r.gstin,'Supplier Name':r.supplierName,'Invoice No':r.invoiceNo,'Invoice Date':r.invoiceDate,
      'Taxable Value':r.taxable, IGST:r.igst, CGST:r.cgst, SGST:r.sgst, Cess:r.cess,
      'Supplier Type':r.supplierType||'', 'GSTR-1 Filed':r.gstr1Filed||'',
    }))), 'GSTR-2B');

    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(currentRcm().map(r=>({
      'Invoice No':r.invoiceNo,'Invoice Date':r.invoiceDate,'Supplier GSTIN':r.gstin,'Supplier Name':r.supplierName,
      'Taxable Value':r.taxable, IGST:r.igst, CGST:r.cgst, SGST:r.sgst, Cess:r.cess,
    }))), 'RCM');
  }

  const wbArray = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  const filename = `ReconIQ_${(activeCompany()?.name||'Company').replace(/\s+/g,'_')}_${state.month}_FY${state.fy}.xlsx`;

  const downloads = await claude.use('downloads').catch(()=>null);
  if(downloads){
    try{
      const blob = new Blob([wbArray], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      await downloads.save({ filename, data: blob });
      toast('Export saved: ' + filename);
    }catch(e){
      if(e && e.code === 'declined'){ /* user declined, no toast noise */ }
      else toast('Could not save the export.');
    }
  } else {
    toast('Downloads are unavailable in this view.');
  }
}

let importState = { kind: null, headers: [], rawRows: [], mapping: {}, replace: false };
const TARGET_FIELDS_BASE = [
  {key:'invoiceNo', label:'Invoice No.', req:true},
  {key:'invoiceDate', label:'Invoice Date', req:true},
  {key:'gstin', label:'Supplier GSTIN', req:true},
  {key:'supplierName', label:'Supplier Name', req:false},
  {key:'taxable', label:'Taxable Value', req:true},
  {key:'igst', label:'IGST', req:false},
  {key:'cgst', label:'CGST', req:false},
  {key:'sgst', label:'SGST', req:false},
  {key:'cess', label:'Cess', req:false},
];
const TARGET_FIELDS_G2B_EXTRA = [
  {key:'supplierType', label:'Supplier Type (Government/Regular)', req:false},
  {key:'gstr1Filed', label:'GSTR-1 Filed (Yes/No)', req:false},
];
function targetFieldsFor(kind){
  return kind === 'gstr2b' ? TARGET_FIELDS_BASE.concat(TARGET_FIELDS_G2B_EXTRA) : TARGET_FIELDS_BASE;
}
const GUESS = {
  invoiceNo:['invoice no','invoice number','inv no','invno','invoice_no'],
  invoiceDate:['invoice date','date','inv date','invoice_date'],
  gstin:['gstin','supplier gstin','gst no','supplier gst'],
  supplierName:['supplier name','supplier','vendor','vendor name','party name','name'],
  taxable:['taxable value','taxable','taxable amt','taxable_value'],
  igst:['igst'], cgst:['cgst'], sgst:['sgst'], cess:['cess'],
  supplierType:['supplier type','type','category','govt','government'],
  gstr1Filed:['gstr-1 filed','gstr1 filed','filing status','filed'],
};

function handleFile(file){
  const kind = state._importTarget || 'books';
  const name = file.name.toLowerCase();
  if(name.endsWith('.csv')){
    Papa.parse(file, { header:true, skipEmptyLines:true, complete: (res) => {
      importState = { kind, headers: res.meta.fields||[], rawRows: res.data, mapping: autoGuessMapping(res.meta.fields||[], kind), replace:false };
      renderAll();
    }, error: () => toast('Could not read that CSV file.') });
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, {defval:''});
        const headers = json.length ? Object.keys(json[0]) : [];
        importState = { kind, headers, rawRows: json, mapping: autoGuessMapping(headers, kind), replace:false };
        renderAll();
      }catch(err){ toast('Could not read that Excel file.'); }
    };
    reader.readAsArrayBuffer(file);
  }
}

function autoGuessMapping(headers, kind){
  const mapping = {};
  targetFieldsFor(kind).forEach(f => {
    const guesses = GUESS[f.key] || [];
    const found = headers.find(h => guesses.includes(String(h).trim().toLowerCase()));
    mapping[f.key] = found || '';
  });
  return mapping;
}

function renderMapping(el){
  const { headers, rawRows, kind } = importState;
  const fields = targetFieldsFor(kind);
  const kindLabel = kind==='books' ? 'Books Purchase Data' : kind==='rcm' ? 'RCM Invoices' : 'GSTR-2B Data';
  el.innerHTML = `
    <div class="section-title">Map columns — ${kindLabel}</div>
    <div class="map-grid">
      ${fields.map(f => `
        <div class="map-row">

          <select class="ctrl" data-map="${f.key}">
            <option value="">— not in file —</option>
            ${headers.map(h => `<option value="${esc(h)}" ${importState.mapping[f.key]===h?'selected':''}>${esc(h)}</option>`).join('')}
          </select>
        </div>`).join('')}
    </div>
    <div class="flex" style="align-items:center;gap:8px;margin:12px 0;">
      <label class="switch"><input type="checkbox" id="replaceToggle" ${importState.replace?'checked':''}><span class="slider-tog"></span></label>
      <span style="font-size:12.5px;color:var(--muted);">Replace existing ${kindLabel} rows for this period before importing</span>
    </div>
    <div class="panel-head"><h3 style="font-size:13.5px;">Preview (first 5 rows)</h3><div class="hint">${fmtNum(rawRows.length)} rows detected in file</div></div>
    <div id="previewWrap"></div>
    <div style="margin-top:14px;display:flex;gap:10px;">
      <button class="btn primary" id="confirmImportBtn">${ICONS.upload} Import ${fmtNum(rawRows.length)} rows</button>
      <button class="btn ghost" id="cancelImportBtn">Cancel</button>
    </div>
  `;
  el.querySelectorAll('[data-map]').forEach(sel => sel.onchange = () => {
    importState.mapping[sel.dataset.map] = sel.value; renderPreview();
  });
  el.querySelector('#replaceToggle').onchange = (e) => importState.replace = e.target.checked;
  el.querySelector('#cancelImportBtn').onclick = () => { importState = {kind:null,headers:[],rawRows:[],mapping:{},replace:false}; renderAll(); };
  el.querySelector('#confirmImportBtn').onclick = confirmImport;
  renderPreview();

  function renderPreview(){
    const sample = rawRows.slice(0,5).map(row => mapRow(row, importState.mapping));
    document.getElementById('previewWrap').innerHTML = sample.length ? renderPlainTable(sample, kind!=='gstr2b') :
      `<div class="table-wrap"><table><tbody><tr class="empty-row"><td>No rows found in file.</td></tr></tbody></table></div>`;
  }
}

function mapRow(row, mapping){
  const g = key => key ? row[key] : '';
  return {
    invoiceNo: g(mapping.invoiceNo), invoiceDate: g(mapping.invoiceDate), gstin: g(mapping.gstin), supplierName: g(mapping.supplierName),
    taxable: parseNum(g(mapping.taxable)), igst: parseNum(g(mapping.igst)), cgst: parseNum(g(mapping.cgst)), sgst: parseNum(g(mapping.sgst)), cess: parseNum(g(mapping.cess)),
    supplierType: mapping.supplierType ? g(mapping.supplierType) : '', gstr1Filed: mapping.gstr1Filed ? g(mapping.gstr1Filed) : '',
  };
}
function parseNum(v){ const n = parseFloat(String(v).replace(/,/g,'')); return isNaN(n) ? 0 : n; }

function confirmImport(){
  const { kind, rawRows, mapping, replace } = importState;
  const fields = targetFieldsFor(kind);
  const required = fields.filter(f=>f.req);
  const missing = required.filter(f => !mapping[f.key]);
  if(missing.length){ toast('Please map: ' + missing.map(f=>f.label).join(', ')); return; }

  const newRows = rawRows.map(row => {
    const mapped = mapRow(row, mapping);
    return Object.assign({ id: uid(), companyId: state.activeCompanyId, fy: state.fy, month: state.month }, mapped);
  }).filter(r => r.invoiceNo);

  const storeKey = kind === 'books' ? 'books' : kind === 'rcm' ? 'rcm' : 'gstr2b';
  if(replace){
    state[storeKey] = state[storeKey].filter(r => !(r.companyId===state.activeCompanyId && r.fy===state.fy && r.month===state.month));
  }
  state[storeKey] = state[storeKey].concat(newRows);
  save();
  const kindLabel = kind==='books' ? 'Books' : kind==='rcm' ? 'RCM' : 'GSTR-2B';
  importState = { kind:null, headers:[], rawRows:[], mapping:{}, replace:false };
  toast(`Imported ${newRows.length} rows into ${kindLabel}`);
  state.page = kind === 'books' ? 'books' : kind === 'rcm' ? 'rcmdata' : 'gstr2b';
  save(); renderAll();
}

function loadSampleData(){
  const co = state.activeCompanyId, fy = state.fy, mo = state.month;
  state.books = state.books.filter(r => !(r.companyId===co && r.fy===fy && r.month===mo));
  state.gstr2b = state.gstr2b.filter(r => !(r.companyId===co && r.fy===fy && r.month===mo));
  state.rcm = state.rcm.filter(r => !(r.companyId===co && r.fy===fy && r.month===mo));

  const suppliers = [
    {name:'Sundaram Steel Traders', gstin:'27AABCS1234F1Z1'},
    {name:'Vikram Packaging Co', gstin:'24AAACV5678K1Z9'},
    {name:'Om Sai Logistics', gstin:'29AAECO4321L1Z3'},
    {name:'Krishna Chemicals Ltd', gstin:'19AAFCK9988M1Z6'},
    {name:'Nova Electricals', gstin:'07AABCN3345P1Z8'},
  ];
  const govtSuppliers = [
    {name:'Municipal Corporation Dept', gstin:'27GOVTM1234F1Z1'},
    {name:'State Electricity Board', gstin:'23GOVTE5678K1Z2'},
  ];
  const mk = (i, over={}) => {
    const s = suppliers[i % suppliers.length];
    const taxable = 10000 + i*1370;
    const igst = i % 2 === 0 ? Math.round(taxable*0.18) : 0;
    const cgst = i % 2 !== 0 ? Math.round(taxable*0.09) : 0;
    const sgst = i % 2 !== 0 ? Math.round(taxable*0.09) : 0;
    return Object.assign({ id: uid(), companyId: co, fy, month: mo,
      invoiceNo: 'INV-'+(1000+i), invoiceDate: `05-${MONTHS.indexOf(mo)+1<10?'0':''}${MONTHS.indexOf(mo)+1}-2025`,
      gstin: s.gstin, supplierName: s.name, taxable, igst, cgst, sgst, cess: 0,
      supplierType: 'Regular', gstr1Filed: i % 4 === 0 ? 'No' : 'Yes',
    }, over);
  };

  const books = [];
  const g2b = [];
  for(let i=0;i<14;i++) books.push(mk(i));
  for(let i=0;i<14;i++){
    if(i===2){ continue; } // missing in 2B
    if(i===5){ const r = mk(i); r.taxable = r.taxable - 850; r.igst = Math.round(r.igst*0.9); g2b.push(r); continue; } // mismatch
    g2b.push(mk(i));
  }
  g2b.push(mk(20)); // missing in books
  g2b.push(mk(21));
  books.push(mk(8)); // duplicate in books (same key as i=8)

  // A couple of Government-supplier GSTR-2B lines, and one dated in an earlier month (Old ITC)
  const gv = govtSuppliers[0];
  g2b.push({ id: uid(), companyId: co, fy, month: mo, invoiceNo:'GOV-501', invoiceDate:`10-${MONTHS.indexOf(mo)+1<10?'0':''}${MONTHS.indexOf(mo)+1}-2025`,
    gstin: gv.gstin, supplierName: gv.name, taxable: 22000, igst: 3960, cgst:0, sgst:0, cess:0, supplierType:'Government', gstr1Filed:'Yes' });
  const prevMonthIdx = (MONTHS.indexOf(mo)+11)%12;
  books.push({ id: uid(), companyId: co, fy, month: mo, invoiceNo:'OLD-77', invoiceDate:`18-${prevMonthIdx+1<10?'0':''}${prevMonthIdx+1}-2025`,
    gstin: suppliers[1].gstin, supplierName: suppliers[1].name, taxable: 9500, igst:0, cgst:855, sgst:855, cess:0, supplierType:'Regular' });

  // Sample RCM invoices (self-invoiced, no counterpart in 2B)
  const rcm = [
    { id: uid(), companyId: co, fy, month: mo, invoiceNo:'RCM-001', invoiceDate:`12-${MONTHS.indexOf(mo)+1<10?'0':''}${MONTHS.indexOf(mo)+1}-2025`,
      gstin:'URP0000000000000', supplierName:'Goods Transport Agency (Unregistered)', taxable:18000, igst:0, cgst:900, sgst:900, cess:0 },
    { id: uid(), companyId: co, fy, month: mo, invoiceNo:'RCM-002', invoiceDate:`22-${MONTHS.indexOf(mo)+1<10?'0':''}${MONTHS.indexOf(mo)+1}-2025`,
      gstin:'URP0000000000001', supplierName:'Legal Consultancy Services', taxable:12500, igst:2250, cgst:0, sgst:0, cess:0 },
  ];

  state.books = state.books.concat(books);
  state.gstr2b = state.gstr2b.concat(g2b);
  state.rcm = state.rcm.concat(rcm);
  save(); renderAll();
  toast('Sample data loaded for ' + mo + ' FY' + fy);
}

/* ============================= INIT ============================= */
renderAll();
</script>
